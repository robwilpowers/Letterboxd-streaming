# Copy to config.toml and edit. config.toml is git-ignored so your API key stays local.

letterboxd_user = "your-letterboxd-username"

# Two-letter country code. Streaming catalogs differ a lot by country.
region = "US"

# Free TMDB key: https://www.themoviedb.org/settings/api
# (or set the TMDB_API_KEY / TMDB_READ_TOKEN environment variable instead)
tmdb_api_key = ""

# Ranking: free services first, then subscriptions, then pay-per-view (rent, then buy).

# Free tier. Only these count as free. Leaving this out uses this same default list.
free_services = ["Tubi TV", "Pluto TV", "Plex", "The Roku Channel", "Kanopy"]

# TMDB sometimes labels other services free (YouTube's free movies, Crackle, Hoopla...).
# false = leave them out of the results; true = count them as free too.
count_other_free = false

# Subscriptions you already pay for. Within the subscription tier these come first;
# other subscriptions follow, cheapest first (prices below).
# Names are matched loosely ("Max", "HBO Max", "Max Amazon Channel" are the same).
my_services = ["Netflix", "Amazon Prime Video"]

# Used to order subscriptions you don't have when no price is known.
unknown_subscription_price = 9.99

# A film released in theaters this many days ago with no home release counts as "in theaters".
theatrical_window_days = 120

# How long cached availability is reused before re-checking (hours).
ttl_hours = 12

# Override monthly prices (USD). Defaults are approximate and will drift.
[prices]
# "Peacock" = 7.99
# "Criterion Channel" = 10.99
